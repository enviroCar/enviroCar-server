name: Publish Docker image

# Manually triggered; select the branch in the "Run workflow" dialog.
#   master -> ghcr.io/envirocar/api:latest
#   dev    -> ghcr.io/envirocar/api:dev
on:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/envirocar/api

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Determine image tag
        id: tag
        run: |
          case "${GITHUB_REF_NAME}" in
            master) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
            dev)    echo "tag=dev"    >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Publishing is only allowed from 'master' or 'dev' (got '${GITHUB_REF_NAME}')"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
